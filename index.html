<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NEGM SECRET CLUB</title>
<link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;
    --accent:#fff;
    --muted:#bdbdbd;
    --glass: rgba(255,255,255,0.04);
    --success:#4ade80;
    --danger:#ff6b6b;
    --glow: #00fff7;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Cutive Mono',monospace;background:var(--bg);color:var(--accent);-webkit-font-smoothing:antialiased}
  .bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:brightness(32%);pointer-events:none}
  header{padding:3.2rem 1rem 0;text-align:center}
  h1{font-family:'Playfair Display',serif;font-size:2.8rem;margin:0;letter-spacing:3px;text-transform:uppercase}
  .sub{color:var(--muted);margin-top:6px}
  .card{max-width:820px;margin:2rem auto;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    border:1px solid rgba(255,255,255,0.06);padding:1.8rem;border-radius:12px;box-shadow:0 18px 60px rgba(0,0,0,0.6)}
  .row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
  /* Fancy Buttons */
  .btn{
    padding:0.8rem 1.4rem;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.15);
    background:linear-gradient(90deg, rgba(0,255,255,0.15), rgba(255,255,255,0.05));
    color:var(--accent);
    cursor:pointer;
    font-family:'Playfair Display',serif;
    letter-spacing:1px;
    transition:all 0.25s ease;
    box-shadow:0 0 10px rgba(0,255,255,0.2);
  }
  .btn:hover{
    transform:translateY(-2px) scale(1.03);
    box-shadow:0 0 20px var(--glow);
    background:linear-gradient(90deg, rgba(0,255,255,0.4), rgba(255,255,255,0.2));
  }
  .btn.primary{
    background:linear-gradient(90deg, #00fff7, #0078ff);
    color:#000;
    box-shadow:0 0 25px rgba(0,255,255,0.4);
  }
  .btn.primary:hover{box-shadow:0 0 35px var(--glow)}
  .icon-btn{width:56px;height:56px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.14);background:transparent;transition:0.3s}
  .icon-btn:hover{box-shadow:0 0 20px var(--glow);transform:scale(1.05)}
  .icon-btn svg{width:22px;height:22px;stroke:white}
  .status{margin-top:12px;font-weight:700;color:var(--muted)}
  .status.success{color:var(--success)}
  .status.fail{color:var(--danger)}
  footer{padding:2rem;text-align:center;color:var(--muted);font-size:0.9rem}
  .hidden{display:none}

  /* Admin section */
  #admin-btn{display:block;margin:2rem auto 1rem auto;}
  #admin-msg{text-align:center;margin-bottom:2rem;font-weight:bold;font-size:1.2rem;}
</style>
</head>
<body>
  <!-- Background video -->
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="https://res.cloudinary.com/ds9bldncb/video/upload/v1761910253/ssstik.io__shotbyfaces_1761828446276_lkfsas.mp4" type="video/mp4">
  </video>

  <header>
    <h1>NEGM SECRET CLUB</h1>
    <div class="sub">Scan the sticker. Enter the password. Apply.</div>
  </header>

  <main class="card" role="main" aria-live="polite">
    <!-- (everything from your original form stays unchanged here) -->
  </main>

  <footer>© NEGM SECRET CLUB</footer>

  <!-- Admin Button -->
  <button id="admin-btn" class="btn">Admin</button>
  <div id="admin-msg"></div>

  <script>
    const adminBtn = document.getElementById('admin-btn');
    const adminMsg = document.getElementById('admin-msg');
    adminBtn.addEventListener('click', ()=>{
      const pass = prompt("Enter admin password:");
      if(pass === "thisissecret"){
        adminMsg.textContent = "Welcome, Admin ✅";
        adminMsg.style.color = "#4ade80";
      } else if(pass){
        adminMsg.textContent = "Access denied ❌";
        adminMsg.style.color = "#ff6b6b";
      }
    });
  </script>
</body>
</html>
