<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NEGM SECRET CLUB</title>
<link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#000;
    --accent:#fff;
    --muted:#bdbdbd;
    --glass: rgba(255,255,255,0.04);
    --success:#4ade80;
    --danger:#ff6b6b;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:'Cutive Mono',monospace;
    background:var(--bg);
    color:var(--accent);
    -webkit-font-smoothing:antialiased;
  }

  /* Background video */
  .bg-video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
    filter:brightness(32%);
    pointer-events:none;
  }

  /* CENTER EVERYTHING */
  .center-wrapper{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    flex-direction:column;
    text-align:center;
  }

  header{
    padding:0;
    margin-bottom:20px;
    text-align:center;
  }

  h1{
    font-family:'Playfair Display',serif;
    font-size:2.8rem;
    margin:0;
    letter-spacing:3px;
    text-transform:uppercase;
    text-align:center;
  }

  .sub{
    color:var(--muted);
    margin-top:6px;
    text-align:center;
  }

  .card{
    max-width:820px;
    width:100%;
    background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    border:1px solid rgba(255,255,255,0.06);
    padding:1.8rem;
    border-radius:12px;
    box-shadow:0 18px 60px rgba(0,0,0,0.6);
    margin-top:20px;
  }

  .btn{
    padding:0.8rem 1.4rem;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.08);
    background:transparent;
    color:var(--accent);
    cursor:pointer;
    font-family:'Playfair Display',serif;
    letter-spacing:1px;
  }

  .btn.primary{
    background:var(--accent);
    color:#000;
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
  }

  .status{
    margin-top:12px;
    font-weight:700;
    color:var(--muted);
  }

  .status.success{color:var(--success)}
  .status.fail{color:var(--danger)}

  form{
    margin-top:1rem;
    text-align:left;
  }

  label{
    display:block;
    font-size:0.95rem;
    color:var(--muted);
    margin-top:10px;
  }

  input{
    width:100%;
    padding:0.7rem;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.06);
    background:transparent;
    color:var(--accent);
    font-family:inherit;
  }

  .two{
    display:flex;
    gap:10px;
  }

  .two > *{flex:1}

  .consent{
    font-size:0.85rem;
    color:var(--muted);
    margin-top:10px;
  }

  .success-box{
    margin-top:14px;
    padding:12px;
    border-radius:8px;
    background:rgba(255,255,255,0.02);
    border:1px solid rgba(255,255,255,0.03);
  }

  .hidden{display:none}
</style>
</head>

<body>

<!-- Background video -->
<video class="bg-video" autoplay muted loop playsinline>
  <source src="https://res.cloudinary.com/ds9bldncb/video/upload/v1761910253/ssstik.io__shotbyfaces_1761828446276_lkfsas.mp4" type="video/mp4">
</video>

<div class="center-wrapper">

  <header>
    <h1>NEGM SECRET CLUB</h1>
    <div class="sub">Enter the password to apply.</div>
  </header>

  <main class="card" role="main">

    <!-- PASSWORD STEP -->
    <section id="step-password">
      <label for="pwd">Enter club password</label>
      <div style="display:flex;gap:12px;justify-content:center;margin-top:8px">
        <input id="pwd" type="password" placeholder="Password" style="max-width:260px" />
        <button id="pwd-submit" class="btn primary">Enter</button>
      </div>
      <div id="pwd-status" class="status"></div>
    </section>

    <!-- FORM STEP -->
    <section id="step-form" class="hidden">
      <form id="apply-form">

        <div class="two">
          <div>
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" required />
          </div>
          <div>
            <label for="age">Age</label>
            <input id="age" name="age" type="number" min="13" required />
          </div>
        </div>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />

        <div class="two">
          <div>
            <label for="phone">Phone Number</label>
            <input id="phone" name="phone" type="tel" placeholder="+20..." required />
          </div>
          <div>
            <label for="insta">Instagram handle</label>
            <input id="insta" name="instagram" type="text" placeholder="yourhandle" />
          </div>
        </div>

        <p class="consent">By submitting, you consent to your data being stored for NEGM Secret Club membership.</p>

        <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
          <button id="back-to-pwd" type="button" class="btn">Back</button>
          <button type="submit" class="btn primary">Submit application</button>
        </div>

      </form>

      <div id="form-status" class="status" style="margin-top:12px"></div>
    </section>

    <!-- SUCCESS -->
    <section id="success" class="hidden">
      <div class="success-box">
        <strong>Application received</strong>
        <div style="color:var(--muted);margin-top:6px">We will contact you via email or Instagram.</div>
      </div>
    </section>

  </main>

</div>

<footer style="text-align:center;margin-top:20px;color:var(--muted)">© NEGM SECRET CLUB</footer>


<script>
(function(){

  const PASSWORD = "whoisnegm";
  const FORMSPREE = "https://formspree.io/f/mqagryey";

  const stepPassword = document.getElementById('step-password');
  const pwdInput = document.getElementById('pwd');
  const pwdSubmit = document.getElementById('pwd-submit');
  const pwdStatus = document.getElementById('pwd-status');

  const stepForm = document.getElementById('step-form');
  const applyForm = document.getElementById('apply-form');
  const formStatus = document.getElementById('form-status');
  const backToPwd = document.getElementById('back-to-pwd');
  const successSection = document.getElementById('success');

  // PASSWORD SUBMIT
  pwdSubmit.addEventListener('click', ()=>{
    const val = pwdInput.value.trim();
    if (!val){
      pwdStatus.textContent = "Enter password.";
      pwdStatus.className = "status fail";
      return;
    }
    if (val === PASSWORD){
      pwdStatus.textContent = "Access granted ✅";
      pwdStatus.className = "status success";

      stepPassword.classList.add('hidden');
      stepForm.classList.remove('hidden');
      setTimeout(()=> document.getElementById('name').focus(), 200);

    } else {
      pwdStatus.textContent = "Wrong password ❌";
      pwdStatus.className = "status fail";
    }
  });

  backToPwd.addEventListener('click', ()=>{
    stepForm.classList.add('hidden');
    stepPassword.classList.remove('hidden');
  });

  // FORM SUBMIT
  applyForm.addEventListener('submit', async (ev)=>{
    ev.preventDefault();

    formStatus.textContent = "Submitting…";
    formStatus.className = "status";

    const formData = new FormData(applyForm);

    try{
      const resp = await fetch(FORMSPREE, {
        method:'POST',
        body: formData,
        headers: { 'Accept':'application/json' }
      });

      const result = await resp.json().catch(()=>null);

      if (resp.ok){
        formStatus.textContent = "";
        stepForm.classList.add('hidden');
        successSection.classList.remove('hidden');
      } else {
        formStatus.textContent = (result && result.error) ? result.error : "Submission failed.";
        formStatus.className = "status fail";
      }

    } catch(err){
      formStatus.textContent = "Network error.";
      formStatus.className = "status fail";
    }
  });

})();
</script>

</body>
</html>
