<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NEGM SECRET CLUB</title>

  <link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-black: #000;
      --muted: #dcdcdc;
      --muted-2: #bfbfbf;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:'Cutive Mono', monospace;
      background:var(--bg-black);
      color:#f5f5f5;
      overflow-x:hidden;
      text-align:center;
    }

    .video-bg{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:-3;
      filter:brightness(55%);
    }

    header{
      height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-transform:uppercase;
      letter-spacing:4px;
      animation:fadeIn 2s ease-out;
    }

    header h1{
      font-family:'Playfair Display', serif;
      font-size:4rem;
      margin-bottom:1rem;
    }

    header p{
      font-size:1.2rem;
      color:#ddd;
    }

    .rules{
      padding:5rem 2rem;
      max-width:800px;
      margin:0 auto;
      font-size:1.1rem;
      line-height:1.8;
      border-top:1px solid #222;
      border-bottom:1px solid #222;
      background:rgba(0,0,0,0.8);
      opacity:0;
      transform:translateY(20px);
      transition:opacity 1s ease, transform 1s ease;
    }

    .rules.in-view{
      opacity:1;
      transform:translateY(0);
    }

    .rules h2{
      font-family:'Playfair Display', serif;
      text-transform:uppercase;
      margin-bottom:1.5rem;
      font-size:2rem;
    }

    .buttons{
      display:flex;
      justify-content:center;
      gap:1rem;
      flex-wrap:wrap;
      margin-top:2rem;
    }

    button{
      background:none;
      border:1px solid #f5f5f5;
      color:#f5f5f5;
      padding:1rem 2.5rem;
      font-family:'Playfair Display', serif;
      font-size:1rem;
      text-transform:uppercase;
      letter-spacing:2px;
      cursor:pointer;
      transition:all 0.4s ease;
      border-radius:40px;
      opacity:0;
      transform:translateY(20px);
    }

    button.in-view{
      opacity:1;
      transform:translateY(0);
    }

    button:hover{
      background:#f5f5f5;
      color:#000;
      transform:scale(1.05);
    }

    footer{
      padding:2rem;
      color:#888;
      font-size:0.9rem;
      letter-spacing:1px;
      opacity:0;
      transition:opacity 1s ease;
    }

    footer.in-view{opacity:1;}

    @keyframes fadeIn{
      from{opacity:0;transform:translateY(10px);}
      to{opacity:1;transform:translateY(0);}
    }
  </style>
</head>
<body>

  <video class="video-bg" autoplay muted loop playsinline>
    <source src="https://res.cloudinary.com/ds9bldncb/video/upload/v1761910253/ssstik.io__shotbyfaces_1761828446276_lkfsas.mp4" type="video/mp4" />
  </video>

  <header>
    <h1>NEGM SECRET CLUB</h1>
    <p>Where silence speaks louder than noise.</p>
  </header>

  <section class="rules" id="rules">
    <h2>Rules of the Club</h2>
    <p>
      1. Stay unseen.<br>
      2. Move fast, stay sharp.<br>
      3. Respect the code.<br>
      4. Win quietly.<br>
      5. The game begins when you say so.
    </p>

    <div class="buttons">
      <a href="apply.html"><button id="btn-apply">Apply Now</button></a>
      <a href="https://www.instagram.com/negmsecret" target="_blank"><button id="btn-ig">Instagram</button></a>
    </div>
  </section>

  <footer id="footer">Special Custom — Designed by <span>NEGM</span></footer>

  <script>
    const rules = document.querySelector('.rules');
    const buttons = document.querySelectorAll('button');
    const footer = document.querySelector('footer');

    const observer = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          entry.target.classList.add('in-view');
        }
      });
    },{threshold:0.2});

    observer.observe(rules);
    buttons.forEach(btn=>observer.observe(btn));
    observer.observe(footer);
  </script>

</body>
</html>
