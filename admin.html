<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NEGM SECRET ADMIN</title>
<link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;
    --accent:#fff;
    --muted:#bdbdbd;
    --glass:rgba(255,255,255,0.03);
    --success:#4ade80;
    --danger:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:var(--bg);
    color:var(--accent);
    font-family:'Cutive Mono',monospace;
    -webkit-font-smoothing:antialiased;
  }
  .panel{
    text-align:center;
    background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    border:1px solid rgba(255,255,255,0.06);
    border-radius:12px;
    box-shadow:0 18px 60px rgba(0,0,0,0.6);
    padding:2rem;
    width:90%;
    max-width:480px;
  }
  h1{
    font-family:'Playfair Display',serif;
    font-size:2.2rem;
    margin:0 0 10px 0;
    letter-spacing:2px;
  }
  p.sub{color:var(--muted);margin-bottom:20px;}
  input{
    width:100%;
    padding:0.8rem;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.06);
    background:transparent;
    color:var(--accent);
    font-family:inherit;
    margin-bottom:14px;
  }
  .btn{
    padding:0.8rem 1.4rem;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.1);
    background:transparent;
    color:var(--accent);
    font-family:'Playfair Display',serif;
    cursor:pointer;
    transition:all 0.25s;
  }
  .btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px rgba(255,255,255,0.25);
  }
  .msg{margin-top:14px;font-weight:700;}
  .msg.success{color:var(--success);}
  .msg.fail{color:var(--danger);}
  a.back{
    display:inline-block;
    margin-top:18px;
    color:var(--muted);
    text-decoration:none;
    font-size:0.9rem;
  }
</style>
</head>
<body>
  <div class="panel">
    <h1>Admin Area</h1>
    <p class="sub">Enter admin password to continue.</p>
    <input id="admin-pass" type="password" placeholder="Admin password" />
    <button id="check-btn" class="btn">Unlock</button>
    <div id="admin-msg" class="msg"></div>
    <a href="index.html" class="back">← Back to site</a>
  </div>
  <script>
    const PASSWORD = "thisissecret";
    document.getElementById('check-btn').addEventListener('click', () => {
      const val = document.getElementById('admin-pass').value.trim();
      const msg = document.getElementById('admin-msg');
      if(val === PASSWORD){
        msg.textContent = "Welcome, Admin ✅";
        msg.className = "msg success";
      } else {
        msg.textContent = "Access denied ❌";
        msg.className = "msg fail";
      }
    });
  </script>
</body>
</html>
