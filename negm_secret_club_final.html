<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NEGM SECRET CLUB</title>
  <link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#000;
      --accent:#f5f5f5;
      --muted:#bbb;
      --success:#4ade80;
      --danger:#ff6b6b;
    }
    *{box-sizing:border-box}
    body {
      margin:0;
      font-family:'Cutive Mono',monospace;
      background:#000;
      color:var(--accent);
      text-align:center;
      overflow-x:hidden;
    }
    video.bg {
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:-2;
      filter:brightness(40%);
    }
    header {padding:4rem 1rem 2rem;}
    h1 {
      font-family:'Playfair Display',serif;
      font-size:3rem;
      text-transform:uppercase;
      letter-spacing:4px;
    }
    .card {
      max-width:650px;
      margin:2rem auto;
      background:rgba(255,255,255,0.05);
      padding:2rem;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.1);
      box-shadow:0 0 30px rgba(0,0,0,0.5);
    }
    .btn {
      display:inline-block;
      padding:0.8rem 1.5rem;
      margin:0.4rem;
      border-radius:50px;
      border:1px solid var(--accent);
      background:transparent;
      color:var(--accent);
      text-transform:uppercase;
      font-family:'Playfair Display',serif;
      letter-spacing:1px;
      cursor:pointer;
      transition:all .2s ease;
    }
    .btn.primary {background:var(--accent); color:#000;}
    .status {margin-top:1rem;}
    .status.success{color:var(--success)}
    .status.fail{color:var(--danger)}
    form {text-align:left;margin-top:1.5rem;}
    label{display:block;margin-top:0.6rem;font-size:0.9rem;color:var(--muted);}
    input{
      width:100%;
      padding:0.7rem 0.8rem;
      border-radius:8px;
      border:1px solid rgba(255,255,255,0.1);
      background:transparent;
      color:var(--accent);
      outline:none;
      font-family:inherit;
    }
    footer{padding:2rem 0;font-size:0.85rem;color:var(--muted)}
  </style>
</head>
<body>
  <video class="bg" autoplay muted loop playsinline>
    <source src="https://res.cloudinary.com/ds9bldncb/video/upload/v1761910253/ssstik.io__shotbyfaces_1761828446276_lkfsas.mp4" type="video/mp4">
  </video>

  <header>
    <h1>NEGM SECRET CLUB</h1>
    <p>Where silence speaks louder than noise.</p>
  </header>

  <main class="card">
    <h2>Join the Club</h2>
    <p>Scan the QR, enter the password, and prove you're one of us.</p>
    <div id="step-scan">
      <button class="btn" id="scan-btn">Scan QR</button>
      <input type="file" id="file-input" accept="image/*" style="display:none">
      <div id="scan-status" class="status"></div>
    </div>

    <div id="step-password" style="display:none">
      <label for="password">Enter Password:</label>
      <input type="password" id="password" placeholder="Password">
      <button class="btn primary" id="check-password">Submit</button>
      <div id="pass-status" class="status"></div>
    </div>

    <div id="step-form" style="display:none">
      <form id="applyForm">
        <label>Name</label>
        <input type="text" id="name" required>
        <label>Age</label>
        <input type="number" id="age" required>
        <label>Email</label>
        <input type="email" id="email" required>
        <label>Instagram</label>
        <input type="text" id="instagram" required>
        <p style="font-size:0.8rem;color:var(--muted);margin-top:0.8rem;">
          By submitting this form, you consent to your data being stored for NEGM Secret Club membership purposes.
        </p>
        <button type="submit" class="btn primary">Submit</button>
      </form>
      <div id="form-status" class="status"></div>
    </div>
  </main>

  <footer>Designed by NEGM</footer>

  <canvas id="canvas" hidden></canvas>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>
    const SCAN_URL = "https://qrfy.io/MPfKSveITk";
    const PASSWORD = "whoisnegm";
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtF3V-GneWmKQWY2cAneYQ3Q564xeCgjlRZxP625rNUFYCRsboGI7zCZxa85mtg96w/exec";

    const scanBtn = document.getElementById('scan-btn');
    const scanStatus = document.getElementById('scan-status');
    const fileInput = document.getElementById('file-input');
    const stepPassword = document.getElementById('step-password');
    const passInput = document.getElementById('password');
    const passBtn = document.getElementById('check-password');
    const passStatus = document.getElementById('pass-status');
    const stepForm = document.getElementById('step-form');
    const form = document.getElementById('applyForm');
    const formStatus = document.getElementById('form-status');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    scanBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', handleFile);

    function handleFile(e){
      const file = e.target.files[0];
      if(!file) return;
      const img = new Image();
      const reader = new FileReader();
      reader.onload = function(ev){
        img.onload = function(){
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
          const code = jsQR(imgData.data, imgData.width, imgData.height);
          if(code){
            if(code.data.trim() === SCAN_URL){
              scanStatus.textContent = "QR verified ✅";
              scanStatus.className = "status success";
              document.getElementById('step-scan').style.display = 'none';
              stepPassword.style.display = 'block';
            } else {
              scanStatus.textContent = "Invalid QR ❌";
              scanStatus.className = "status fail";
            }
          } else {
            scanStatus.textContent = "No QR detected.";
          }
        }
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    passBtn.addEventListener('click', () => {
      if(passInput.value.trim() === PASSWORD){
        passStatus.textContent = "Access granted ✅";
        passStatus.className = "status success";
        stepPassword.style.display = 'none';
        stepForm.style.display = 'block';
      } else {
        passStatus.textContent = "Wrong password ❌";
        passStatus.className = "status fail";
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      formStatus.textContent = "Submitting...";
      const payload = {
        name: document.getElementById('name').value,
        age: document.getElementById('age').value,
        email: document.getElementById('email').value,
        instagram: document.getElementById('instagram').value,
        qrToken: SCAN_URL
      };
      try{
        const res = await fetch(SCRIPT_URL, {
          method:"POST",
          body: JSON.stringify(payload),
          headers:{"Content-Type":"application/json"}
        });
        if(res.ok){
          formStatus.textContent = "Form submitted successfully ✅";
          formStatus.className = "status success";
          form.reset();
        } else {
          formStatus.textContent = "Error submitting form.";
          formStatus.className = "status fail";
        }
      }catch(err){
        formStatus.textContent = "Network error.";
        formStatus.className = "status fail";
      }
    });
  </script>
</body>
</html>
